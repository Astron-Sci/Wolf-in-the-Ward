<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>群里有个狼病友 · Wolf in the Ward</title>
<style>
:root{--wx-bg:#ededed;--wx-me:#95ec69;--wx-other:#fff;--p5-red:#d7263d;--p5-black:#111;--p5-white:#f5f5f5;--ink:#1a1a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#2b2b2b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);display:flex;justify-content:center;align-items:center}
#phone{width:420px;max-width:100vw;height:100%;max-height:900px;background:var(--wx-bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.6)}
#topbar{background:#2c2c2c;color:#fff;padding:10px 14px 12px;flex:0 0 auto}
#topbar .row{display:flex;justify-content:space-between;align-items:center}
#groupName{font-size:15px;font-weight:600}
#dayTag{font-size:12px;opacity:.75}
#stats{display:flex;gap:14px;margin-top:8px;font-size:12px;align-items:center}
#weiWrap{flex:1}
#weiBarBg{height:8px;background:#4a4a4a;border-radius:5px;overflow:hidden}
#weiBar{height:100%;width:60%;background:linear-gradient(90deg,#ffb703,#d7263d);transition:width .45s ease}
#stats .num{font-weight:700}
#chat{flex:1 1 auto;overflow-y:auto;padding:14px 12px 8px}
.sys{text-align:center;font-size:11px;color:#8a8a8a;margin:8px 0}
.msg{margin-bottom:14px;display:flex;gap:8px;align-items:flex-start;opacity:0;transform:translateY(8px);animation:pop .3s forwards}
@keyframes pop{to{opacity:1;transform:none}}
.avatar{width:36px;height:36px;border-radius:6px;flex:0 0 36px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:700}
.bubble{background:var(--wx-other);border-radius:8px;padding:9px 12px;font-size:14px;line-height:1.55;max-width:270px;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.name{font-size:11px;color:#9a9a9a;margin-bottom:3px}
.badge{display:inline-block;margin-left:5px;background:#4a8fe0;color:#fff;font-size:9px;padding:0 4px;border-radius:3px;vertical-align:1px}
.kw{cursor:pointer;border-bottom:1px dashed #c9a227;transition:background .15s}
.kw:hover{background:#ffe9a8}
.kw.hit-flash{background:#ffd0d0}
.me .bubble{background:var(--wx-me)}
.me{flex-direction:row-reverse}
#bottom{flex:0 0 auto;background:#f7f7f7;border-top:1px solid #ddd;padding:8px 10px;display:flex;gap:8px;align-items:center}
#bottom input{flex:1;border:none;background:#fff;border-radius:6px;padding:9px 12px;font-size:13px;color:#aaa}
#skipBtn{background:#e8e8e8;border:none;border-radius:6px;padding:9px 12px;font-size:13px;color:#555;cursor:pointer}
.overlay{position:absolute;inset:0;background:rgba(10,10,10,.82);display:none;z-index:20}
.overlay.on{display:block}
#intern{position:absolute;right:10px;bottom:16px;width:120px;text-align:center}
#internFace{width:110px;height:140px;margin:0 auto;background:var(--p5-black);border:3px solid var(--p5-red);clip-path:polygon(0 6%,88% 0,100% 94%,12% 100%);display:flex;align-items:center;justify-content:center;color:var(--p5-white);font-size:13px;font-weight:800;font-style:italic;letter-spacing:1px;transform:skewY(-3deg)}
#internTag{margin-top:6px;color:var(--p5-white);font-size:11px;font-style:italic;letter-spacing:1px}
#panel{position:absolute;left:14px;right:138px;bottom:16px;display:flex;flex-direction:column;gap:9px}
.panelTitle{color:var(--p5-red);font-weight:800;font-style:italic;font-size:14px;letter-spacing:1px;transform:skewY(-2deg)}
.opt{background:var(--p5-black);color:var(--p5-white);border:2px solid var(--p5-black);padding:10px 12px;font-size:13px;line-height:1.45;cursor:pointer;clip-path:polygon(0 0,100% 4%,97% 100%,2% 96%);transform:skewY(-2deg);transition:.15s}
.opt:hover{background:var(--p5-red);border-color:var(--p5-red);transform:skewY(-2deg) translateX(4px)}
.opt.back{background:#3a3a3a;border-color:#3a3a3a;color:#c9c9c9;font-size:12px}
.kw.hint{animation:hintpulse 1.6s infinite}
@keyframes hintpulse{0%,100%{background:transparent}50%{background:#ffe08a}}
.kw.dead{color:#a9a9a9;text-decoration:line-through;border-bottom:none;cursor:default;background:transparent!important;animation:none!important}
#startcard{position:absolute;inset:0;background:#111;color:#f5f5f5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;z-index:50;text-align:center}
#startcard h1{font-style:italic;font-weight:900;font-size:44px;line-height:1.08;letter-spacing:3px;margin:0 0 14px;color:#fff;transform:skewY(-4deg);text-shadow:5px 5px 0 var(--p5-red),-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000}
#startcard .sub{font-size:12.5px;color:#bdbdbd;margin-bottom:20px;line-height:1.7;max-width:300px}
.diffbtn{width:230px;background:#1c1c1c;border:2px solid #444;color:#eee;padding:11px;margin:6px 0;font-size:14px;cursor:pointer;clip-path:polygon(0 0,100% 4%,97% 100%,2% 96%);text-align:left}
.diffbtn:hover{border-color:var(--p5-red);background:#231012}
.diffbtn b{color:var(--p5-red)}
.diffbtn small{display:block;color:#999;font-size:11px;margin-top:3px}
.avpick{width:54px;height:54px;object-fit:cover;border:2px solid #444;border-radius:6px;margin:5px;cursor:pointer;filter:grayscale(.35)}
.avpick.sel{border-color:var(--p5-red);filter:none;transform:translateY(-2px)}
#avRow{display:flex;flex-wrap:wrap;justify-content:center;max-width:300px}
#bookBtn{position:absolute;right:12px;top:62px;z-index:15;background:#111;color:#f5f5f5;border:2px solid var(--p5-red);border-radius:4px;padding:5px 9px;font-size:12px;cursor:pointer;display:none}
#book{position:absolute;inset:5% 6%;background:#141414;border:3px solid var(--p5-red);color:#eee;padding:16px 18px;overflow:auto;z-index:45;display:none}
#book.on{display:block}
#book h2{font-style:italic;color:var(--p5-red);margin:0 0 10px;font-size:16px}
#book li{font-size:13px;line-height:1.85;margin-bottom:5px}
#bookClose{float:right;cursor:pointer;color:#999;font-size:13px}
#memp{position:absolute;inset:5% 6%;background:#141414;border:3px solid #4a8fe0;color:#eee;padding:16px 18px;overflow:auto;z-index:46;display:none}
#memp.on{display:block}
#memp h2{font-style:italic;color:#4a8fe0;margin:0 0 10px;font-size:15px}
#memp p{font-size:12.5px;line-height:1.7;margin:5px 0;border-left:3px solid #333;padding-left:8px}
#memp p.bad{border-left-color:var(--p5-red);color:#ffb3b3}
#endcard{position:absolute;inset:0;background:var(--p5-black);color:var(--p5-white);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;z-index:30}
#endcard.on{display:flex}
#endcard h1{font-style:italic;font-size:26px;letter-spacing:2px;margin:0 0 6px;color:var(--p5-red);transform:skewY(-3deg)}
#endcard .rank{font-size:34px;font-weight:900;font-style:italic;margin:10px 0;color:#fff;transform:skewY(-3deg);text-shadow:3px 3px 0 var(--p5-red)}
#endcard p{font-size:13px;line-height:1.7;color:#cfcfcf;margin:6px 0}
#replay{margin-top:18px;background:var(--p5-red);border:none;color:#fff;font-size:14px;font-weight:700;padding:11px 26px;cursor:pointer;clip-path:polygon(0 0,100% 5%,96% 100%,3% 95%)}
#toast{position:absolute;left:50%;top:74px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:40;max-width:80%;text-align:center}
#toast.on{opacity:1}
</style>
</head>

var GROUPS=[
{id:"lumbar",title:"骨科康复交流群",sys:"运动系统",
 rums:{
  s1:{kp:"椎间盘的位置与构成",beginner:[
    {t:"不是骨头啦。椎间盘就是夹在两节椎骨中间的软垫子，外面一圈纤维环，里面是果冻样的髓核。",ok:true},
    {t:"椎间盘就是骨头，磨没了自然就瘫了。",ok:false},
    {t:"椎间盘长在椎骨里面，磨的是骨头。",ok:false}],
   directions:[
    {t:"先说它是啥做的",opts:[
      {t:"外面一圈纤维环，里面是髓核，说白了就是个软垫子，不是硬骨头。",ok:true},
      {t:"椎间盘就是一块实心的骨头。",ok:false}]},
    {t:"先说它长在哪儿",opts:[
      {t:"夹在相邻两节椎骨中间，一节一个。",ok:false},
      {t:"长在椎骨的里面。",ok:false}]}]},
  s2:{kp:"肩关节的构成与脱位方向",beginner:[
    {t:"别自己推。肩关节的窝本来就浅，前面下方最薄弱，所以最容易往下掉，得找医生复位。",ok:true},
    {t:"自己推回去就行，脱臼不是大事。",ok:false},
    {t:"肩关节的窝很深、很牢，不会脱臼。",ok:false}],
   directions:[
    {t:"先说它由什么组成",opts:[
      {t:"肱骨头对着肩胛骨的关节盂，就是咱们说的球窝关节，能转一大圈。",ok:true},
      {t:"是大腿骨的头对着髋臼，跟肩没关系。",ok:false}]},
    {t:"说说为啥容易掉",opts:[
      {t:"窝浅、前面下方那层囊也薄，所以往前往下最容易掉。",ok:false},
      {t:"肩关节最容易往上方掉。",ok:false}]}]},
  s3:{kp:"膝关节的构成与辅助结构",beginner:[
    {t:"半月板不是骨头，是两个纤维软骨垫，能缓冲、加深关节窝，还帮着稳住膝盖。",ok:true},
    {t:"半月板就是骨头，磨没了只能换关节。",ok:false},
    {t:"半月板把膝盖的关节腔分成两间。",ok:false}],
   directions:[
    {t:"先说膝盖由什么组成",opts:[
      {t:"股骨下端、胫骨上端，再加一块髌骨，三块凑起来。",ok:true},
      {t:"是股骨和腓骨拼的。",ok:false}]},
    {t:"说说半月板是啥",opts:[
      {t:"它是辅助结构，管缓冲、管加深关节窝。",ok:false},
      {t:"它是关节基本结构的一部分。",ok:false}]}]},
  s4:{kp:"脊柱的四个生理弯曲",beginner:[
    {t:"人本来就有四个弯：脖子和腰往前凸，胸和骶往后凸，这是正常的，不是没长好。",ok:true},
    {t:"脊柱越直越健康，有弯就是没长好。",ok:false},
    {t:"脊柱只有一个生理弯曲。",ok:false}],
   directions:[
    {t:"说说四个弯朝哪边",opts:[
      {t:"颈曲、腰曲往前凸，胸曲、骶曲往后凸。",ok:true},
      {t:"四个弯都朝同一边。",ok:false}]},
    {t:"说说它们有啥用",opts:[
      {t:"能加弹性、缓冲震荡，走路跑跳都靠它卸力。",ok:false},
      {t:"是病态，得矫正。",ok:false}]}]},
  s5:{kp:"胸骨角及其标志意义",beginner:[
    {t:"那不是长歪了。胸口这个凸起叫胸骨角，对着第 2 根肋骨，数肋骨就从这儿数。",ok:true},
    {t:"那是骨头长歪了，按下去就好。",ok:false},
    {t:"胸骨角对着第 1 根肋骨。",ok:false}],
   directions:[
    {t:"说说它有啥用",opts:[
      {t:"它是数肋骨的标志，平对第 2 肋。",ok:true},
      {t:"它平对第 5 肋。",ok:false}]},
    {t:"说说它长在哪",opts:[
      {t:"在胸骨柄和胸骨体接头的地方。",ok:false},
      {t:"在胸骨体和剑突之间。",ok:false}]}]},
  s6:{kp:"红骨髓与黄骨髓",beginner:[
    {t:"不会抽干。成人骨髓分红骨髓和黄骨髓，管造血的是红骨髓，黄骨髓主要是脂肪，需要时还能转回来。",ok:true},
    {t:"抽骨髓会把造血的抽干，很伤身。",ok:false},
    {t:"成人的骨髓全是黄骨髓，不造血。",ok:false}],
   directions:[
    {t:"说说分几种",opts:[
      {t:"分红骨髓和黄骨髓，造血靠红骨髓。",ok:true},
      {t:"只有一种，不分颜色。",ok:false}]},
    {t:"说说都长在哪",opts:[
      {t:"成人的红骨髓主要在扁骨、短骨和长骨两头。",ok:false},
      {t:"红骨髓全在长骨中间那段。",ok:false}]}]},
  s7:{kp:"骨密质与骨松质",beginner:[
    {t:"不是实心的。骨头外面硬的那层叫骨密质，里面的骨松质像海绵，长骨中间以硬的那层为主，两头以海绵那层为主。",ok:true},
    {t:"骨头外面硬，里面也是实心的。",ok:false},
    {t:"骨松质比骨密质还致密。",ok:false}],
   directions:[
    {t:"说说两层啥区别",opts:[
      {t:"骨密质致密，骨松质像海绵。",ok:true},
      {t:"骨松质才是致密坚硬的那层。",ok:false}]},
    {t:"说说都长在哪",opts:[
      {t:"长骨中间以骨密质为主，两头以骨松质为主。",ok:false},
      {t:"长骨两头全是致密的骨密质。",ok:false}]}]},
  s8:{kp:"髋关节的稳固结构与髂股韧带",beginner:[
    {t:"髋关节可比肩膀稳多了。髋臼深、还有一圈髋臼唇，关节囊厚、韧带结实，其中髂股韧带管着不让它过度后伸。",ok:true},
    {t:"髋关节最灵活，也最容易脱位。",ok:false},
    {t:"管着不让髋过伸的是股骨头韧带。",ok:false}],
   directions:[
    {t:"说说它为什么稳",opts:[
      {t:"窝深、有髋臼唇，囊厚韧带强，天生就是承重的关节。",ok:true},
      {t:"髋臼很浅，所以稳定性差。",ok:false}]},
    {t:"说说哪条韧带管过伸",opts:[
      {t:"是髂股韧带，最粗最结实那条。",ok:false},
      {t:"是坐股韧带管着。",ok:false}]}]},
  s9:{kp:"肘关节三点关系及鉴别意义",beginner:[
    {t:"摸得出来。屈肘时内上髁、外上髁和鹰嘴这三个点成个等腰三角形，伸肘成一条线；脱位了这关系就变了，单纯髁上骨折不变。",ok:true},
    {t:"只能拍片，摸不出来。",ok:false},
    {t:"脱位和髁上骨折都会让三点关系变。",ok:false}],
   directions:[
    {t:"说说正常是什么样",opts:[
      {t:"屈肘时三点成等腰三角形，伸肘时成一条直线。",ok:true},
      {t:"正常时三点成等边三角形。",ok:false}]},
    {t:"说说怎么用来鉴别",opts:[
      {t:"脱位时三点关系变了，髁上骨折还是正常。",ok:false},
      {t:"两种情况三点关系都会变。",ok:false}]}]},
  s10:{kp:"距骨滑车形态与踝内翻扭伤",beginner:[
    {t:"跟骨头形状真有关系。距骨上面这块前宽后窄，脚往下踩（跖屈）时窄的那头进窝，就不稳了；外侧韧带又比较薄，所以爱往内翻，伤的也是外侧。",ok:true},
    {t:"崴脚只跟鞋好不好有关。",ok:false},
    {t:"内翻扭伤伤的是内侧那条韧带。",ok:false}],
   directions:[
    {t:"说说骨头的形状",opts:[
      {t:"距骨滑车前宽后窄，所以往下踩的时候不稳。",ok:true},
      {t:"距骨滑车前后一样宽。",ok:false}]},
    {t:"说说伤的是哪边",opts:[
      {t:"外侧韧带薄，内翻扭伤多是伤外侧。",ok:false},
      {t:"内翻扭伤伤的是内侧三角韧带。",ok:false}]}]},
  s11:{kp:"足弓的构成与功能",beginner:[
    {t:"有弧度才是好的。足弓是脚里的骨头加上脚底的韧带、肌腱一起撑起来的，分内侧纵弓、外侧纵弓和横弓，走路能缓冲、能保护。",ok:true},
    {t:"脚底板平的才健康，有弧度是没长好。",ok:false},
    {t:"足弓只有纵弓一种。",ok:false}],
   directions:[
    {t:"说说它由啥撑起来",opts:[
      {t:"骨头加脚底的韧带和肌腱，一块儿撑。",ok:true},
      {t:"光靠骨头撑着，跟韧带没关系。",ok:false}]},
    {t:"说说它有啥用",opts:[
      {t:"支持、缓冲、保护，走路才不震。",ok:false},
      {t:"没啥用，扁平足反而更好。",ok:false}]}]},
  s12:{kp:"腱鞘的结构与临床意义",beginner:[
    {t:"那不是骨头。手腕上那个包多半是腱鞘囊肿，腱鞘是包着肌腱的一层套子，里面有滑液，帮着减少摩擦；按破只是滑液散开了，容易再长。",ok:true},
    {t:"那是骨头突出，按破就好了。",ok:false},
    {t:"腱鞘和骨膜是一回事。",ok:false}],
   directions:[
    {t:"说说腱鞘是啥",opts:[
      {t:"外面纤维层、里面滑膜层，包着肌腱，减少摩擦。",ok:true},
      {t:"就是骨头表面那层骨膜。",ok:false}]},
    {t:"说说按破行不行",opts:[
      {t:"按破只是滑液散了，容易复发，最好还是看医生。",ok:false},
      {t:"按破一次就根治了。",ok:false}]}]},
  s13:{kp:"颅底的孔裂与穿行结构",beginner:[
    {t:"颅底上全是孔。神经和血管要进出脑子，就得从这些孔里过，比如视神经管、卵圆孔、棘孔、枕骨大孔。",ok:true},
    {t:"颅骨是完整一整块，上面没孔。",ok:false},
    {t:"颅底那些孔是骨折造成的。",ok:false}],
   directions:[
    {t:"说说有哪些孔",opts:[
      {t:"视神经管、卵圆孔、棘孔、枕骨大孔，都是通道。",ok:true},
      {t:"颅底是块完整的板，没孔。",ok:false}]},
    {t:"说说孔里有啥",opts:[
      {t:"都是神经血管进出颅腔的通道。",ok:false},
      {t:"孔是病变破的洞。",ok:false}]}]},
  s14:{kp:"膈的三个裂孔",beginner:[
    {t:"不是一层死膜。膈把胸腔腹腔隔开，上面有三个孔：主动脉裂孔、食管裂孔、腔静脉孔，分别让主动脉、食管、下腔静脉穿过去。",ok:true},
    {t:"胸腹之间就是一层完整的膜，啥也不穿过。",ok:false},
    {t:"膈上的孔只让血过。",ok:false}],
   directions:[
    {t:"说说有哪些孔",opts:[
      {t:"主动脉裂孔、食管裂孔、腔静脉孔，三个。",ok:true},
      {t:"膈上没有孔。",ok:false}]},
    {t:"说说分别过什么",opts:[
      {t:"食管走食管裂孔，下腔静脉走腔静脉孔。",ok:false},
      {t:"食管走的是腔静脉孔。",ok:false}]}]}},

 rums:{
  n1:{kp:"食管的三处生理狭窄",beginner:[
    {t:"食管可不是直筒子。全长有三处窄的地方：刚开头、被左主支气管压住那儿、还有穿膈的地方。东西容易卡住、长东西也爱在这三处。",ok:true},
    {t:"食管就是个直筒子，没窄的地方。",ok:false},
    {t:"食管就入口那一处窄。",ok:false}],
   directions:[
    {t:"先说窄在哪三处",opts:[
      {t:"一开头、跟左主支气管交叉那儿、穿膈的食管裂孔那儿。",ok:true},
      {t:"就入口那一处窄。",ok:false}]},
    {t:"说说这有啥要紧",opts:[
      {t:"这三处最容易卡东西，也是长瘤子爱去的地方。",ok:false},
      {t:"食管窄只是影响说话。",ok:false}]}]},
  n2:{kp:"肝门及其出入结构",beginner:[
    {t:"肝门不是随便叫的。就是肝脏面那条横沟，门静脉、肝固有动脉、肝管都打这儿进进出出。",ok:true},
    {t:"就是个叫法，没实际东西。",ok:false},
    {t:"肝门就是胆囊开口的地方。",ok:false}],
   directions:[
    {t:"说说肝门是啥",opts:[
      {t:"肝脏面那条横沟，血管胆管都打这儿进出。",ok:true},
      {t:"是胆囊开口的地方。",ok:false}]},
    {t:"说说里面都过什么",opts:[
      {t:"门静脉、肝固有动脉、肝管。",ok:false},
      {t:"只有肝静脉。",ok:false}]}]},
  n3:{kp:"胃的入口与出口",beginner:[
    {t:"胃上头进、下头出。进来那道门叫贲门，接着食管；出去那道叫幽门，连着十二指肠。",ok:true},
    {t:"胃是个口袋，进出都在上头。",ok:false},
    {t:"出口直接连空肠。",ok:false}],
   directions:[
    {t:"先说进出的名字",opts:[
      {t:"入口叫贲门，出口叫幽门。",ok:true},
      {t:"入口叫幽门。",ok:false}]},
    {t:"说说各连着谁",opts:[
      {t:"贲门接食管，幽门接十二指肠。",ok:false},
      {t:"幽门直接接空肠。",ok:false}]}]},
  n4:{kp:"十二指肠的分部与大乳头",beginner:[
    {t:"十二指肠不是一根直筒子，分四段：上部、降部、水平部、升部。降部那儿有个大乳头，胆总管和胰管都开在这儿。",ok:true},
    {t:"就是一段直管，不分段。",ok:false},
    {t:"名字是因为它有十二段。",ok:false}],
   directions:[
    {t:"说说分几段",opts:[
      {t:"四段：上部、降部、水平部、升部。",ok:true},
      {t:"就一段。",ok:false}]},
    {t:"说说哪儿有开口",opts:[
      {t:"降部的大乳头，胆总管和胰管一起开在这儿。",ok:false},
      {t:"十二指肠上没有管道开口。",ok:false}]}]},
  n5:{kp:"咽峡的构成",beginner:[
    {t:"嗓子眼那儿有结构，叫咽峡，是口腔和咽的分界，由腭垂、两边腭舌弓和舌根围成一圈。",ok:true},
    {t:"嗓子眼就是个洞，没啥结构。",ok:false},
    {t:"是软腭和咽后壁围的。",ok:false}],
   directions:[
    {t:"说说它由啥围成",opts:[
      {t:"腭垂、两边腭舌弓，再加舌根。",ok:true},
      {t:"腭垂和咽后壁。",ok:false}]},
    {t:"说说它在哪儿",opts:[
      {t:"口腔和咽的分界。",ok:false},
      {t:"咽和喉的分界。",ok:false}]}]},
  n6:{kp:"胆汁的来源与胆囊的功能",beginner:[
    {t:"胆汁是肝分泌的，胆囊只管存和浓缩。切了胆囊胆汁照旧有，就是得少食多餐慢慢适应。",ok:true},
    {t:"胆囊造胆汁，切了就一点油不能吃。",ok:false},
    {t:"没胆囊就没胆汁了。",ok:false}],
   directions:[
    {t:"先说胆汁谁产的",opts:[
      {t:"肝细胞产的，胆囊负责存和浓缩。",ok:true},
      {t:"胆囊产的。",ok:false}]},
    {t:"说说切了以后",opts:[
      {t:"胆汁还是肝在产，少食多餐就行。",ok:false},
      {t:"没胆囊就不能消化油了。",ok:false}]}]},
  n7:{kp:"阑尾位置与麦氏点",beginner:[
    {t:"阑尾在右边，不在左边。它长在右髂窝，根部连着盲肠后内侧；压痛点就在麦氏点，右髂前上棘跟肚脐连线的中外三分之一那儿。",ok:true},
    {t:"阑尾在左边，不会有事。",ok:false},
    {t:"压痛点在中上腹。",ok:false}],
   directions:[
    {t:"说说它在哪边",opts:[
      {t:"右髂窝，根部连着盲肠后内侧。",ok:true},
      {t:"左边髂窝。",ok:false}]},
    {t:"说说压痛点在哪儿",opts:[
      {t:"麦氏点，右髂前上棘和肚脐连线中外三分之一。",ok:false},
      {t:"剑突下面。",ok:false}]}]}},

      {role:"s1",parts:[{t:"我这两天右下腹有点胀。"}]}]}]},{id:"nerve",title:"神经康复交流群",sys:"神经系统",
 rums:{
  m1:{kp:"内囊的位置与损伤表现",beginner:[
    {t:"半身没劲真不一定是老了。内囊在尾状核、豆状核和丘脑中间，上上下下的传导束都从这儿挤过去；伤了一侧就会出现对侧偏瘫、偏身感觉差、还有偏盲，合起来叫三偏。",ok:true},
    {t:"半身没劲就是年纪大了。",ok:false},
    {t:"内囊是脑子里的一个空腔。",ok:false}],
   directions:[
    {t:"先说内囊在哪儿",opts:[
      {t:"夹在尾状核、豆状核和丘脑中间，传导束都打这儿过。",ok:true},
      {t:"是脑里的一个空腔。",ok:false}]},
    {t:"说说伤了会怎样",opts:[
      {t:"对侧偏瘫、偏身感觉障碍、偏盲，三样一起来。",ok:false},
      {t:"只影响听力。",ok:false}]}]},
  m2:{kp:"脑干的分部",beginner:[
    {t:"脑干是一段一段的，从下往上依次是延髓、脑桥、中脑。",ok:true},
    {t:"就是一根连着脊髓的管子，不分段。",ok:false},
    {t:"从上是中脑、延髓、脑桥。",ok:false}],
   directions:[
    {t:"说说从下到上是什么",opts:[
      {t:"延髓、脑桥、中脑。",ok:true},
      {t:"中脑、脑桥、延髓。",ok:false}]},
    {t:"说说它连着谁",opts:[
      {t:"上接间脑，下连脊髓。",ok:false},
      {t:"上连脊髓，下接大脑。",ok:false}]}]},
  m3:{kp:"视觉传导路与视野缺损",beginner:[
    {t:"看东西少一半不一定眼睛的锅。视交叉那儿，两眼视网膜鼻侧的纤维交叉过去；视交叉中间坏了是双颞侧偏盲，一侧视束坏了是对侧同向偏盲。",ok:true},
    {t:"一定是眼睛坏了。",ok:false},
    {t:"视交叉坏了只影响一只眼。",ok:false}],
   directions:[
    {t:"说说交叉的是哪半",opts:[
      {t:"鼻侧半视网膜的纤维交叉。",ok:true},
      {t:"颞侧半的交叉。",ok:false}]},
    {t:"说说坏了会怎样",opts:[
      {t:"一侧视束坏了，对侧同向偏盲。",ok:false},
      {t:"只影响同侧视野。",ok:false}]}]},
  m4:{kp:"脑脊液的产生与循环",beginner:[
    {t:"脑子泡着水是正常的，那叫脑脊液。由各脑室的脉络丛产生，顺着室间孔、中脑水管、第四脑室流到蛛网膜下隙，最后经蛛网膜粒回到上矢状窦。",ok:true},
    {t:"脑子进水了，是病。",ok:false},
    {t:"是脑膜分泌的。",ok:false}],
   directions:[
    {t:"说说谁产的",opts:[
      {t:"各脑室的脉络丛。",ok:true},
      {t:"脑膜。",ok:false}]},
    {t:"说说它怎么走",opts:[
      {t:"从脑室流到蛛网膜下隙，最后经蛛网膜粒进上矢状窦。",ok:false},
      {t:"直接排到血里，不走蛛网膜粒。",ok:false}]}]},
  m5:{kp:"硬脑膜窦的构成与内容",beginner:[
    {t:"脑子外面不止一层膜。硬脑膜有两层，两层之间留出的空隙就是硬脑膜窦；上矢状窦、横窦、乙状窦都是，里面走的是静脉血。",ok:true},
    {t:"脑子外面只有一层膜。",ok:false},
    {t:"窦里面是脑脊液。",ok:false}],
   directions:[
    {t:"说说窦是怎么来的",opts:[
      {t:"硬脑膜两层分开，中间留出的空隙。",ok:true},
      {t:"脑表面的空腔。",ok:false}]},
    {t:"说说里面走什么",opts:[
      {t:"静脉血，是颅内血液回流的道。",ok:false},
      {t:"脑脊液。",ok:false}]}]},
  m6:{kp:"面神经与舌下神经的区别",beginner:[
    {t:"伸舌头偏了，多半是舌下神经的事，不一定是面瘫。面神经管表情，舌下神经管舌头，是两条神经。",ok:true},
    {t:"伸舌偏了就是面瘫。",ok:false},
    {t:"面神经和舌下神经是同一条。",ok:false}],
   directions:[
    {t:"说说两条神经管啥",opts:[
      {t:"舌下神经管舌肌，面神经管表情肌。",ok:true},
      {t:"第Ⅶ对管舌头。",ok:false}]},
    {t:"说说表现",opts:[
      {t:"伸舌偏，提示舌下神经受累。",ok:false},
      {t:"提示面神经受累。",ok:false}]}]},
  m7:{kp:"脑神经与脊神经的数目",beginner:[
    {t:"不一样的。脑神经 12 对，脊神经 31 对。",ok:true},
    {t:"脑神经和脊神经一样多。",ok:false},
    {t:"脑神经只有 10 对。",ok:false}],
   directions:[
    {t:"说说脑神经几对",opts:[
      {t:"12 对。",ok:true},
      {t:"10 对。",ok:false}]},
    {t:"说说脊神经几对",opts:[
      {t:"31 对。",ok:false},
      {t:"12 对。",ok:false}]}]}},

      {role:"s1",parts:[{t:"我这两周也记不住数目。"}]}]}]},{id:"vessel",title:"高血压病友交流群",sys:"脉管系统",
 rums:{
  v1:{kp:"心传导系统的组成与起搏点",beginner:[
    {t:"心跳可不靠大脑指挥。心自己就有套传导系统：窦房结、结间束、房室结、房室束、左右束支和浦肯野纤维网，里头窦房结是正常起搏点。",ok:true},
    {t:"心跳快慢全靠大脑指挥。",ok:false},
    {t:"心的起搏点是房室结。",ok:false}],
   directions:[
    {t:"说说都由哪些组成",opts:[
      {t:"窦房结、结间束、房室结、房室束、左右束支和浦肯野纤维网。",ok:true},
      {t:"就窦房结一个。",ok:false}]},
    {t:"说说谁发号施令",opts:[
      {t:"窦房结是正常起搏点。",ok:false},
      {t:"房室结才是起搏点。",ok:false}]}]},
  v2:{kp:"主动脉弓的三大分支",beginner:[
    {t:"主动脉弓往头上发三根：从右往左是头臂干、左颈总动脉、左锁骨下动脉。",ok:true},
    {t:"脖子上的血管堵一根不打紧。",ok:false},
    {t:"从右往左是左颈总、头臂干、左锁骨下。",ok:false}],
   directions:[
    {t:"说说发几根",opts:[
      {t:"三根：头臂干、左颈总动脉、左锁骨下动脉。",ok:true},
      {t:"就两根。",ok:false}]},
    {t:"说说谁在最右边",opts:[
      {t:"最右边是头臂干。",ok:false},
      {t:"最右边是左锁骨下动脉。",ok:false}]}]},
  v3:{kp:"肝门静脉的组成与门腔吻合",beginner:[
    {t:"肝硬化呕血跟肝的血管有关。门静脉是肠系膜上静脉和脾静脉在胰颈后面汇成的；压力一高，血就绕道食管那圈的吻合支走，撑破了就呕血。",ok:true},
    {t:"是胃坏了，跟肝的血管没关系。",ok:false},
    {t:"门静脉是肝静脉和脾静脉汇的。",ok:false}],
   directions:[
    {t:"说说门静脉怎么来的",opts:[
      {t:"肠系膜上静脉加脾静脉，在胰颈后面汇合。",ok:true},
      {t:"肝静脉加脾静脉。",ok:false}]},
    {t:"说说为啥会呕血",opts:[
      {t:"门静脉压力高，血从食管那圈吻合支走，撑破了。",ok:false},
      {t:"跟门静脉没关系。",ok:false}]}]},
  v4:{kp:"上腔静脉的组成",beginner:[
    {t:"上半身的血有主干道。上腔静脉是左右头臂静脉，在右侧第 1 胸肋关节后头汇成的。",ok:true},
    {t:"上半身的血直接回心，没有主干。",ok:false},
    {t:"是颈内静脉和锁骨下静脉直接汇的。",ok:false}],
   directions:[
    {t:"说说它怎么来的",opts:[
      {t:"左右头臂静脉汇合而成。",ok:true},
      {t:"颈内静脉单独构成。",ok:false}]},
    {t:"说说汇在哪儿",opts:[
      {t:"右侧第 1 胸肋关节后面。",ok:false},
      {t:"左侧第 3 肋。",ok:false}]}]},
  v5:{kp:"胸导管的起始与注入",beginner:[
    {t:"淋巴可不是废水。胸导管是全身最大的淋巴管，从乳糜池起，收下半身和左上半身的淋巴，最后注入左静脉角。",ok:true},
    {t:"淋巴就是废水，随便流流。",ok:false},
    {t:"胸导管注入右静脉角。",ok:false}],
   directions:[
    {t:"说说它从哪儿起",opts:[
      {t:"从乳糜池起。",ok:true},
      {t:"从右淋巴导管起。",ok:false}]},
    {t:"说说注到哪儿",opts:[
      {t:"左静脉角。",ok:false},
      {t:"右静脉角。",ok:false}]}]},
  v6:{kp:"静脉角的构成与注入结构",beginner:[
    {t:"脖子根那儿有结构，叫静脉角，是颈内静脉和锁骨下静脉汇合的地方。左边有胸导管注入，右边是右淋巴导管。",ok:true},
    {t:"脖子根没啥重要结构。",ok:false},
    {t:"两边都注入胸导管。",ok:false}],
   directions:[
    {t:"说说它由什么汇成",opts:[
      {t:"颈内静脉加锁骨下静脉。",ok:true},
      {t:"颈外静脉加锁骨下静脉。",ok:false}]},
    {t:"说说谁注进来",opts:[
      {t:"左边是胸导管注进来的。",ok:false},
      {t:"两边都是右淋巴导管。",ok:false}]}]},
  v7:{kp:"肺循环的途径与血流性质",beginner:[
    {t:"肺循环是：右心室→肺动脉→肺→肺静脉→左心房。注意肺动脉里是静脉血，肺静脉里才是动脉血，跟体循环正相反。",ok:true},
    {t:"肺动脉里流的是含氧血。",ok:false},
    {t:"肺静脉里是静脉血。",ok:false}],
   directions:[
    {t:"说说走哪条路",opts:[
      {t:"右心室经肺动脉到肺，再经肺静脉回左心房。",ok:true},
      {t:"从左心室开始。",ok:false}]},
    {t:"说说血是哪种",opts:[
      {t:"肺动脉里是静脉血，肺静脉里是动脉血。",ok:false},
      {t:"肺动脉里是动脉血。",ok:false}]}]}},

      {role:"s0",parts:[{t:"我体检说胸导管，听不懂。"}]}]},

      {role:"s1",parts:[{t:"有人说"},{t:"脖子根没什么重要结构",kw:"v6"},{t:"。"}]},
      {role:"s3",parts:[{t:"我听说过静脉角这个词。"}]}]},
  {M:[{role:"admin",parts:[{t:"最后一天了，说说这周的收获吧。"}]},
      {role:"s0",parts:[{t:"有人说"},{t:"肺动脉里流的是含氧血",kw:"v7"},{t:"，和体循环一样。"}]},
      {role:"s1",parts:[{t:"这个我一直搞不清。"}]}]}]},{id:"resp",title:"呼吸康复交流群",sys:"呼吸系统",
 rums:{
  b1:{kp:"喉腔最狭窄的部位",beginner:[
    {t:"喉腔最窄的地方是声门裂，不是喉口。要是肿了或者卡了东西，最容易在这儿堵。",ok:true},
    {t:"嗓子哑就是上火，声带那儿最宽。",ok:false},
    {t:"最窄的地方在喉口。",ok:false}],
   directions:[
    {t:"说说最窄是哪儿",opts:[
      {t:"声门裂。",ok:true},
      {t:"喉口。",ok:false}]},
    {t:"说说这有啥要紧",opts:[
      {t:"它最窄，所以水肿或者异物时最容易堵住。",ok:false},
      {t:"跟堵不堵没关系。",ok:false}]}]},
  b2:{kp:"气管的分叉平面",beginner:[
    {t:"气管是分成两根，不是三根。大约在胸骨角那个平面分成左、右主支气管。",ok:true},
    {t:"气管是分成三根的。",ok:false},
    {t:"在脖子那儿就分开了。",ok:false}],
   directions:[
    {t:"说说分成几根",opts:[
      {t:"左、右两根主支气管。",ok:true},
      {t:"三根。",ok:false}]},
    {t:"说说在哪个平面分",opts:[
      {t:"大约平胸骨角。",ok:false},
      {t:"在脖子第 2 颈椎那儿。",ok:false}]}]},
  b3:{kp:"左右主支气管的差异与临床意义",beginner:[
    {t:"呛东西多半进右边。右侧那根又粗又短还陡，左侧的细长又平，所以异物爱往右边掉。",ok:true},
    {t:"呛东西都往左边去。",ok:false},
    {t:"两边一模一样。",ok:false}],
   directions:[
    {t:"说说两边啥区别",opts:[
      {t:"右边粗、短、陡；左边细、长、平。",ok:true},
      {t:"左边又粗又陡。",ok:false}]},
    {t:"说说有啥临床意义",opts:[
      {t:"异物更容易掉进右侧主支气管。",ok:false},
      {t:"更容易进左侧。",ok:false}]}]},
  b4:{kp:"鼻旁窦的组成与开口",beginner:[
    {t:"鼻窦有四对：额窦、上颌窦、筛窦、蝶窦。上颌窦的口开在中鼻道，位置偏高，引流不太顺，所以爱发炎。",ok:true},
    {t:"鼻窦就一对，长在额头上。",ok:false},
    {t:"上颌窦开口在下鼻道。",ok:false}],
   directions:[
    {t:"说说有几对",opts:[
      {t:"四对：额窦、上颌窦、筛窦、蝶窦。",ok:true},
      {t:"就额窦一对。",ok:false}]},
    {t:"说说上颌窦开口在哪",opts:[
      {t:"开口在中鼻道，位置高、引流差。",ok:false},
      {t:"开口在下鼻道，引流最好。",ok:false}]}]},
  b5:{kp:"胸膜腔的概念",beginner:[
    {t:"胸膜腔不是胸腔。它是脏胸膜和壁胸膜之间那个密闭的小空隙，里面是负压，只有一点浆液，不是装着空气。",ok:true},
    {t:"胸膜腔就是胸腔，里面装着空气。",ok:false},
    {t:"胸膜腔跟外界通着。",ok:false}],
   directions:[
    {t:"说说它到底是啥",opts:[
      {t:"脏胸膜和壁胸膜之间的密闭腔隙。",ok:true},
      {t:"就是胸腔，里面是空气。",ok:false}]},
    {t:"说说里面有什么",opts:[
      {t:"负压，只有少量浆液。",ok:false},
      {t:"跟外界自由相通。",ok:false}]}]},
  b6:{kp:"左右肺的形态区别",beginner:[
    {t:"左肺两叶，右肺三叶。左肺前缘还有个心切迹，是心脏压出来的。",ok:true},
    {t:"左右肺都是三叶。",ok:false},
    {t:"左肺比右肺还多一叶。",ok:false}],
   directions:[
    {t:"说说各分几叶",opts:[
      {t:"左肺两叶，右肺三叶。",ok:true},
      {t:"两边都是三叶。",ok:false}]},
    {t:"说说心切迹在哪",opts:[
      {t:"在左肺的前缘。",ok:false},
      {t:"在右肺的前缘。",ok:false}]}]},
  b7:{kp:"膈与呼吸运动",beginner:[
    {t:"呼吸主要靠膈和肋间外肌。吸气时膈往下压、胸腔变大，不是肺自己把气吸进去的。",ok:true},
    {t:"呼吸全靠肺自己，跟膈没关系。",ok:false},
    {t:"吸气时膈是往上抬的。",ok:false}],
   directions:[
    {t:"说说靠什么",opts:[
      {t:"主要靠膈和肋间外肌。",ok:true},
      {t:"完全靠肺自己。",ok:false}]},
    {t:"说说吸气时膈怎么动",opts:[
      {t:"膈收缩下降，胸腔变大。",ok:false},
      {t:"膈松弛上抬。",ok:false}]}]}},

      {role:"s1",parts:[{t:"我这两天总觉得气短。"}]}]}]},{id:"urine",title:"肾友交流群",sys:"泌尿系统",
 rums:{
  u1:{kp:"肾单位的组成",beginner:[
    {t:"肾不是个大滤网就完了。肾单位才是干活的基本单位，由肾小体和肾小管两部分组成，尿就在这儿生成。",ok:true},
    {t:"肾就是个大滤网，没什么结构。",ok:false},
    {t:"肾单位只有肾小管。",ok:false}],
   directions:[
    {t:"说说由哪两部分",opts:[
      {t:"肾小体加肾小管。",ok:true},
      {t:"只有肾小管。",ok:false}]},
    {t:"说说它是干啥的",opts:[
      {t:"是肾产生尿液的结构和功能单位。",ok:false},
      {t:"是存尿的地方。",ok:false}]}]},
  u2:{kp:"输尿管的三处生理性狭窄",beginner:[
    {t:"输尿管不是粗细一样的管子。全长有三处窄：肾盂出来那儿、跨过髂血管那儿、穿膀胱壁那儿。结石就爱卡在这三处。",ok:true},
    {t:"输尿管粗细一样，卡住是运气不好。",ok:false},
    {t:"只有一处窄。",ok:false}],
   directions:[
    {t:"说说窄在哪三处",opts:[
      {t:"肾盂输尿管移行处、跨髂血管处、穿膀胱壁处。",ok:true},
      {t:"就一处。",ok:false}]},
    {t:"说说这有啥意义",opts:[
      {t:"结石容易滞留在这三处。",ok:false},
      {t:"结石只会在肾里，不会卡在输尿管。",ok:false}]}]},
  u3:{kp:"膀胱三角",beginner:[
    {t:"膀胱里面有个特别的地方叫膀胱三角，在膀胱底内面，是两边输尿管口和尿道内口围出来的。这块黏膜光滑没皱襞，是结核和肿瘤爱长的地方。",ok:true},
    {t:"膀胱内壁都差不多，没特别的地方。",ok:false},
    {t:"膀胱三角在膀胱尖。",ok:false}],
   directions:[
    {t:"说说它在哪儿",opts:[
      {t:"膀胱底内面，两边输尿管口加尿道内口围起来的。",ok:true},
      {t:"在膀胱尖部。",ok:false}]},
    {t:"说说它有啥特别",opts:[
      {t:"黏膜光滑没皱襞，是结核和肿瘤好发的地方。",ok:false},
      {t:"皱襞最多，最能撑。",ok:false}]}]},
  u4:{kp:"肾门及其出入结构",beginner:[
    {t:"肾门不是随便开的门，是肾内侧缘中间那个凹陷，肾动脉、肾静脉、肾盂、神经、淋巴管都打这儿进出。",ok:true},
    {t:"肾门就血管，没别的。",ok:false},
    {t:"肾门在肾的外侧缘。",ok:false}],
   directions:[
    {t:"说说它在哪儿",opts:[
      {t:"肾内侧缘中部。",ok:true},
      {t:"肾外侧缘。",ok:false}]},
    {t:"说说有什么进出",opts:[
      {t:"肾动脉、肾静脉、肾盂、神经和淋巴管。",ok:false},
      {t:"只有肾动脉。",ok:false}]}]},
  u5:{kp:"肾的位置与被膜",beginner:[
    {t:"肾在脊柱两侧、腹膜后面，左肾比右肾稍高一点。肾外面有三层被膜：纤维囊、脂肪囊、肾筋膜，管着固定和保护。",ok:true},
    {t:"肾在肚子正中间，被膜没啥用。",ok:false},
    {t:"右肾比左肾高。",ok:false}],
   directions:[
    {t:"说说它在哪儿",opts:[
      {t:"脊柱两侧、腹膜后面，左肾略高于右肾。",ok:true},
      {t:"右肾比左肾高。",ok:false}]},
    {t:"说说有几层被膜",opts:[
      {t:"三层：纤维囊、脂肪囊、肾筋膜。",ok:false},
      {t:"外面没有任何被膜。",ok:false}]}]},
  u6:{kp:"尿液的排出途径",beginner:[

function settle(){
  S.over=true;closeReason();
  var rank=S.wei>=90?"华佗再世":S.wei>=75?"杏林圣手":S.wei>=60?"妙手回春":S.wei>=40?"赤脚医生":S.wei>=20?"江湖郎中":"庸医";
  var ec=document.getElementById("endcard");ec.innerHTML="";
  var h=document.createElement("h1");h.textContent="7 DAYS CLEARED";
  var r=document.createElement("div");r.className="rank";r.textContent="头衔："+rank;
  var p1=document.createElement("p");p1.textContent="威信 "+S.wei+" / 100　　群内剩余狼 "+S.wolves+" / 起始 2";
  var p2=document.createElement("p");p2.textContent="辟谣成功 "+S.good+" 条　失败 "+S.bad+" 条";
  var _min=Math.round((Date.now()-(S.t0||Date.now()))/6000)/10;
  var p3=document.createElement("p");p3.textContent="本局用时约 "+_min+" 分钟";
  ec.appendChild(h);ec.appendChild(r);ec.appendChild(p1);ec.appendChild(p2);ec.appendChild(p3);ec.appendChild(replayBtn());
  ec.classList.add("on");
}
function replayBtn(){var b=document.createElement("button");b.id="replay";b.textContent="重玩";b.onclick=function(){location.reload()};return b}

document.getElementById("skipBtn").onclick=function(){
  if(!S.diff||S.over)return;
  endDay();
};

function startGame(level){
  S.diff=level;
  S.av=AVATARS.length?Math.floor(Math.random()*AVATARS.length):0;
  var _gm=location.hash.match(/g([1-8])/);
  CUR=_gm?GROUPS[parseInt(_gm[1],10)-1]:GROUPS[Math.floor(Math.random()*GROUPS.length)];
  RUMS=CUR.rums;DAYS=CUR.days;
  document.getElementById("groupName").textContent=CUR.title+"(20)";
  CAST=buildCast();
  S.day=1;S.good=0;S.bad=0;S.poster={};S.todayResolved={};S.todayRumors=[];S.records={};S.t0=Date.now();
  var sc=document.getElementById("startcard");if(sc&&sc.parentNode){sc.parentNode.removeChild(sc)}
  document.getElementById("bookBtn").style.display=(level<=2)?"block":"none";
  var f=document.getElementById("internFace");
  if(AVATARS.length){f.style.backgroundImage="url("+AVATARS[S.av]+")";f.style.backgroundSize="cover";f.style.backgroundPosition="center";f.innerHTML="";}
  hud();newDay();showDay();
  if(level<=2){setTimeout(applyHint,1800)}
}
function applyHint(){
  var els=document.querySelectorAll(".kw");for(var i=0;i<els.length;i++){if(!els[i].classList.contains("dead"))els[i].classList.add("hint")}
}
function markDead(key){
  var els=document.querySelectorAll(".kw");
  for(var i=0;i<els.length;i++){
    var k=els[i].dataset.k;
    if(!key||k===key){els[i].classList.remove("hint");els[i].classList.add("dead")}
  }
}
function openBook(){
  var bk=document.getElementById("book");bk.innerHTML="";
  var h=document.createElement("h2");h.textContent="本节要点 · 椎间盘与神经根";
  var c=document.createElement("span");c.id="bookClose";c.textContent="关闭 ✕";c.onclick=function(){bk.classList.remove("on")};
  h.appendChild(c);bk.appendChild(h);
  var ul=document.createElement("ul");
  ["椎间盘位于相邻两个椎体之间，由外周的纤维环和中央的髓核构成。",
   "髓核多向后外侧突出，压迫的是从脊髓发出的神经根，不是整条脊髓。",
   "神经根受压只影响该神经根支配的区域（感觉、运动、反射），不等于整条腿瘫痪。",
   "腰骶部神经根聚成马尾；若受压严重且未及时处理，可出现大小便功能障碍，属需紧急处理的情况。",
   "所以腰突严不严重，取决于压迫的部位和程度，不是一压就瘫。"].forEach(function(t){
    var li=document.createElement("li");li.textContent=t;ul.appendChild(li);
  });
  bk.appendChild(ul);bk.classList.add("on");
}
function renderStart(){
  var sc=document.getElementById("startcard");sc.innerHTML="";
  var h=document.createElement("h1");h.textContent="群里有个狼病友";
  var s=document.createElement("div");s.className="sub";s.textContent="你是刚进群的实习医生，每天在群里找出谣言并辟谣。先选难度：";
  sc.appendChild(h);sc.appendChild(s);
  [{n:1,t:"新手",d:"单选理由；可疑发言有提示；可随时查课本（推荐大一）"},
   {n:2,t:"进阶",d:"先选辟谣方向，再选理由；有提示与课本"},
   {n:3,t:"硬核",d:"先选方向再选理由；无提示、无课本；每题限时 40 秒、选项打乱"}].forEach(function(x){
    var b=document.createElement("div");b.className="diffbtn";
    b.innerHTML="<b>"+x.t+"</b><small>"+x.d+"</small>";
    b.onclick=function(){startGame(x.n)};
    sc.appendChild(b);
  });
}
document.getElementById("bookBtn").onclick=openBook;
renderStart();
var _h=location.hash;
var _auto=_h.indexOf("#d1")>=0?1:_h.indexOf("#d2")>=0?2:_h.indexOf("#d3")>=0?3:0;
if(_auto){setTimeout(function(){
  startGame(_auto);
  if(_h.indexOf("book")>=0){setTimeout(openBook,2800)}
  else if(_h.indexOf("panel")>=0){setTimeout(function(){if(S.todayRumors.length){openReason(S.todayRumors[0])}},2800)}
  if(_h.indexOf("mem")>=0){setTimeout(function(){var k=Object.keys(S.records);if(k.length){showMember(parseInt(k[0],10))}},5200)}
  if(_h.indexOf("fulltest")>=0){setTimeout(function(){
(function autoDay(){
  if(S.over){sysLine("FULLTEST 提前结束 day="+S.day+" over="+S.over+" 威信="+S.wei);return}
  if(S.day>7){sysLine("FULLTEST 完成 day="+S.day+" over="+S.over+" 威信="+S.wei+" 剩余狼="+S.wolves+" 成功="+S.good);return}
  var id=S.todayRumors[0];
  if(!id){endDay();setTimeout(autoDay,900);return}
  openReason(id);
  setTimeout(function(){
    var r=RUMS[id];
    var src=(S.diff===1)?r.beginner:r.directions[0].opts;
    var ok=null;src.forEach(function(o){if(o.ok)ok=o});
    pickReason(id, ok||{t:"（自动）",ok:true});
    setTimeout(function(){
      var b=document.querySelector("#panel .opt.back");
      if(b&&b.onclick){b.onclick()}
      setTimeout(function(){endDay();setTimeout(autoDay,900)},900);
    },1500);
  },600);
})();
},3000)}
  if(_h.indexOf("failtest")>=0){setTimeout(function(){
    var id=S.todayRumors[0];if(!id)return;
    openReason(id);
    setTimeout(function(){
      var r=RUMS[id];var src=(S.diff===1)?r.beginner:r.directions[0].opts;
      var bad=null;src.forEach(function(o){if(!o.ok&&!bad)bad=o});
      pickReason(id,bad||{t:"（测试）",ok:false});
    },700);
  },3000)}
  if(_h.indexOf("kicktest")>=0){setTimeout(function(){
    var w=CAST.members.filter(function(m){return m.isWolf})[0];
    var nm=w.name;w.kicked=true;S.wolves--;
    S.day=2;newDay();
    var appears=resolveDay().some(function(m){return m.who===w.idx});
    var nxt=nextFollower().idx===w.idx;
    sysLine("KICKTEST 被踢者："+nm+"　第二天再出现："+(appears?"是（异常）":"否（正常）")+"　跟风者是否又是TA："+(nxt?"是（异常）":"否（正常）"));
  },3200)}
  if(_h.indexOf("selftest")>=0){setTimeout(function(){
    var id=S.todayRumors[0];if(!id){sysLine("SELFTEST 无谣言");return}
    openReason(id);
    setTimeout(function(){var r0=RUMS[id];var src=(S.diff===1)?r0.beginner:r0.directions[0].opts;var ok=null;src.forEach(function(o){if(o.ok)ok=o});pickReason(id,ok||{t:"（测试）",ok:true});},700);
    setTimeout(function(){var b=panel.querySelector(".opt.back");if(b&&b.onclick){b.onclick();}},2600);
    setTimeout(function(){sysLine("SELFTEST locked="+S.locked+"　resolved="+Object.keys(S.todayResolved).join(","));},3400);
  },3000)}
  if(_h.indexOf("cast")>=0){setTimeout(function(){var noAv=CAST.members.filter(function(m){return m.av==null}).map(function(m){return m.name});sysLine("素头像成员：("+noAv.length+"人) "+noAv.join("、"));sysLine("带图头像共 "+CAST.members.filter(function(m){return m.av!=null}).length+" 人")},3400)}
},300)}
</script>
</body>
